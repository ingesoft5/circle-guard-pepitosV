version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    # Updates follow the normal flow (PR to dev), never straight to main.
    target-branch: dev
    schedule:
      interval: weekly
    # Version updates paused (0): each closed PR freed a slot and Dependabot opened the next,
    # one CI build each. Security updates are separate and keep working.
    open-pull-requests-limit: 0
    # Major versions (Spring Boot 4, Gradle 9, Kotlin 2...) are planned upgrades, not bumps.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /
    # Updates follow the normal flow (PR to dev), never straight to main.
    target-branch: dev
    schedule:
      interval: weekly
    # Version updates paused (0): each closed PR freed a slot and Dependabot opened the next,
    # one CI build each. Security updates are separate and keep working.
    open-pull-requests-limit: 0
    # Major versions (Spring Boot 4, Gradle 9, Kotlin 2...) are planned upgrades, not bumps.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /mobile
    # Updates follow the normal flow (PR to dev), never straight to main.
    target-branch: dev
