{{- /*
Canary of .Values.canary.service with Flagger and Linkerd (docs/arquitectura/service-mesh.md).
A new revision of the Deployment starts the analysis: Flagger moves stepWeight % of the traffic
to <service>-canary each interval through the HTTPRoute, checks the proxy metrics and promotes
at maxWeight, or sends everything back to <service>-primary after `threshold` failed checks.
*/ -}}
{{- if eq (include "circleguard.canaryOn" .) "true" }}
{{- $c := .Values.canary -}}
{{- $name := $c.service -}}
{{- $spec := index .Values.services $name -}}
{{- $ctx := dict "root" $ "name" $name -}}
{{- $ns := .Release.Namespace -}}
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: linkerd-success-rate
  labels:
    {{- include "circleguard.labels" $ctx | nindent 4 }}
spec:
  provider:
    type: prometheus
    address: {{ $c.prometheusUrl }}
  # Share of inbound responses of the canary pods that Linkerd does not classify as failures.
  # Flagger fills in namespace, target and interval; the backquotes keep Helm out of them.
  query: {{ `sum(rate(response_total{namespace="{{ namespace }}", deployment=~"{{ target }}", direction="inbound", classification!="failure"}[{{ interval }}])) / sum(rate(response_total{namespace="{{ namespace }}", deployment=~"{{ target }}", direction="inbound"}[{{ interval }}])) * 100` | quote }}
---
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: linkerd-latency
  labels:
    {{- include "circleguard.labels" $ctx | nindent 4 }}
spec:
  provider:
    type: prometheus
    address: {{ $c.prometheusUrl }}
  # p99 of the inbound latency of the canary pods, in milliseconds.
  query: {{ `histogram_quantile(0.99, sum by (le) (rate(response_latency_ms_bucket{namespace="{{ namespace }}", deployment=~"{{ target }}", direction="inbound"}[{{ interval }}])))` | quote }}
---
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: {{ $name }}
  labels:
    {{- include "circleguard.labels" $ctx | nindent 4 }}
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ $name }}}
  {{- if $spec.hpa }}
  # Flagger copies the HPA to <service>-primary; the original targets the canary Deployment,
  # which sits at 0 replicas between analyses.
  autoscalerRef: {apiVersion: autoscaling/v2, kind: HorizontalPodAutoscaler, name: {{ $name }}}
  {{- end }}
  progressDeadlineSeconds: 600
  service:
    name: {{ $name }}
    port: {{ $spec.port }}
    targetPort: {{ $spec.port }}
    portName: http
    # The HTTPRoute hangs from the Service itself (Linkerd's GAMMA mode), not from a Gateway.
    gatewayRefs:
      - {group: core, kind: Service, name: {{ $name }}, namespace: {{ $ns }}, port: {{ $spec.port }}}
    apex:
      labels:
        {{- include "circleguard.labels" $ctx | nindent 8 }}
    # Only primary and canary carry the metrics label, so each pod is scraped once.
    primary:
      labels:
        {{- include "circleguard.labels" $ctx | nindent 8 }}
        circleguard.io/metrics: "true"
    canary:
      labels:
        {{- include "circleguard.labels" $ctx | nindent 8 }}
        circleguard.io/metrics: "true"
  analysis:
    interval: {{ $c.analysis.interval }}
    threshold: {{ $c.analysis.threshold }}
    stepWeight: {{ $c.analysis.stepWeight }}
    maxWeight: {{ $c.analysis.maxWeight }}
    metrics:
      - {name: success-rate, templateRef: {name: linkerd-success-rate}, thresholdRange: {min: {{ $c.minSuccessRate }}}, interval: 1m}
      - {name: latency-p99, templateRef: {name: linkerd-latency}, thresholdRange: {max: {{ $c.maxLatencyMs }}}, interval: 1m}
    webhooks:
      # Before any traffic moves: the new pods answer readiness through the mesh.
      - name: acceptance
        type: pre-rollout
        url: {{ $c.loadtesterUrl }}
        timeout: 60s
        metadata:
          type: bash
          cmd: "curl -sf http://{{ $name }}-canary.{{ $ns }}:{{ $spec.port }}/actuator/health/readiness"
      # During the analysis: steady load on the apex Service, split by the HTTPRoute weights.
      - name: load
        type: rollout
        url: {{ $c.loadtesterUrl }}
        timeout: 5s
        metadata:
          cmd: "hey -z 1m -q 5 -c 2 http://{{ $name }}.{{ $ns }}:{{ $spec.port }}{{ $c.loadPath }}"
{{- end }}
