{{- /*
Single entry point of the environment. The web client's nginx serves the app and forwards
/svc/<service>/ to the internal Services, so only the web Service is published.
Port 80 redirects to HTTPS. Port 443 serves the cert-manager certificate.
*/ -}}
{{- if .Values.ingress.enabled }}
{{- if .Values.ingress.tls.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  labels:
    {{- include "circleguard.labels" (dict "root" . "name" "circleguard") | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: circleguard-http
  labels:
    {{- include "circleguard.labels" (dict "root" . "name" "circleguard") | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-https-redirect@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: circleguard
  labels:
    {{- include "circleguard.labels" (dict "root" . "name" "circleguard") | nindent 4 }}
  {{- if .Values.ingress.tls.enabled }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - secretName: {{ .Values.ingress.tls.secretName }}
      {{- with .Values.ingress.host }}
      hosts:
        - {{ . | quote }}
      {{- end }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
{{- end }}
