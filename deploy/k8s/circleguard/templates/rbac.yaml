{{- /*
Deployer and viewer for this namespace. Workloads do not mount a token; these
accounts are for the people and the pipeline that manage the release.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: circleguard-deployer
  labels:
    {{- include "circleguard.labels" (dict "root" $ "name" "deployer") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: circleguard-deployer
  labels:
    {{- include "circleguard.labels" (dict "root" $ "name" "deployer") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "serviceaccounts", "persistentvolumeclaims", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: circleguard-deployer
  labels:
    {{- include "circleguard.labels" (dict "root" $ "name" "deployer") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: circleguard-deployer
subjects:
  - kind: ServiceAccount
    name: circleguard-deployer
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: circleguard-viewer
  labels:
    {{- include "circleguard.labels" (dict "root" $ "name" "viewer") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: circleguard-viewer
  labels:
    {{- include "circleguard.labels" (dict "root" $ "name" "viewer") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "services", "pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: circleguard-viewer
  labels:
    {{- include "circleguard.labels" (dict "root" $ "name" "viewer") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: circleguard-viewer
subjects:
  - kind: ServiceAccount
    name: circleguard-viewer
    namespace: {{ .Release.Namespace }}
