environment: dev
# Linkerd and the gateway canary start in dev (docs/arquitectura/service-mesh.md).
mesh:
  enabled: true
canary:
  enabled: true
# The dev node has 2 vCPU. With the mesh, every service adds a Linkerd proxy and the canary
# runs gateway-primary next to gateway, so the default 100m request per service left no room
# and gateway-primary stayed Pending. Idle services use about 5-20m.
spring:
  resources:
    requests: {cpu: 50m}
services:
  file:
    config:
      # Bucket of Terraform (output storage_bucket of envs/dev).
      CIRCLEGUARD_STORAGE_S3_BUCKET: circleguard-k3s-dev-files-028658486093
  auth:
    config:
      QR_EXPIRATION: "120000"
      CIRCLEGUARD_FEATURES_QR_DIAGNOSTICS: "true"
