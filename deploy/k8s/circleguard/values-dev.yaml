environment: dev
# Linkerd and the gateway canary start in dev (docs/arquitectura/service-mesh.md).
mesh:
  enabled: true
canary:
  enabled: true
services:
  file:
    config:
      # Bucket of Terraform (output storage_bucket of envs/dev).
      CIRCLEGUARD_STORAGE_S3_BUCKET: circleguard-k3s-dev-files-028658486093
  auth:
    config:
      QR_EXPIRATION: "120000"
      CIRCLEGUARD_FEATURES_QR_DIAGNOSTICS: "true"
# The k3s node has no ExternalIP, so deployK8s cannot find the public name. The Elastic IP is
# fixed in Terraform (docs/arquitectura/infraestructura.md).
ingress:
  tls:
    dnsName: 52.204.64.188.sslip.io
