environment: prod
middleware:
  postgres:
    storage: {size: 5Gi}
  neo4j:
    storage: {size: 3Gi}
services:
  file:
    config:
      # Bucket of Terraform (output storage_bucket of envs/prod).
      CIRCLEGUARD_STORAGE_S3_BUCKET: circleguard-k3s-prod-files-028658486093
  auth:
    config:
      QR_EXPIRATION: "30000"
      CIRCLEGUARD_FEATURES_QR_DIAGNOSTICS: "false"
  gateway:
    hpa: {minReplicas: 2, maxReplicas: 4}
  form:
    hpa: {minReplicas: 2, maxReplicas: 4}
