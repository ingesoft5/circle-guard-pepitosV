environment: prod
# Linkerd (mTLS) only. No canary: an analysis starts one more gateway JVM and the prod node
# does not have the memory for it (docs/arquitectura/service-mesh.md#memoria).
mesh:
  enabled: true
middleware:
  postgres:
    storage: {size: 5Gi}
  neo4j:
    storage: {size: 3Gi}
services:
  file:
    config:
      # Bucket of Terraform (output storage_bucket of envs/prod).
      CIRCLEGUARD_STORAGE_S3_BUCKET: circleguard-k3s-prod-files-028658486093
  auth:
    config:
      QR_EXPIRATION: "30000"
      CIRCLEGUARD_FEATURES_QR_DIAGNOSTICS: "false"
  gateway:
    hpa: {minReplicas: 2, maxReplicas: 4}
  form:
    hpa: {minReplicas: 2, maxReplicas: 4}
# The k3s node has no ExternalIP, so deployK8s cannot find the public name. The Elastic IP is
# fixed in Terraform (docs/arquitectura/infraestructura.md).
ingress:
  tls:
    dnsName: 34.227.254.255.sslip.io
