environment: stage
# Linkerd (mTLS) and the gateway canary, as in dev (docs/arquitectura/service-mesh.md).
mesh:
  enabled: true
canary:
  enabled: true
services:
  file:
    config:
      # Bucket of Terraform (output storage_bucket of envs/stage).
      CIRCLEGUARD_STORAGE_S3_BUCKET: circleguard-k3s-stage-files-028658486093
  auth:
    config:
      QR_EXPIRATION: "30000"
      CIRCLEGUARD_FEATURES_QR_DIAGNOSTICS: "false"
middleware:
  postgres:
    storage: {size: 3Gi}
# The k3s node has no ExternalIP, so deployK8s cannot find the public name. The Elastic IP is
# fixed in Terraform (docs/arquitectura/infraestructura.md).
ingress:
  tls:
    dnsName: 3.221.162.144.sslip.io
