# Base values shared by dev, stage and prod. Each values-<env>.yaml only overrides sizes,
# replicas and the public host; the image is the same in every environment (image.tag).
environment: dev

image:
  # Private registry (tools host, reached through the VPC peering). The pipeline sets both:
  #   --set image.registry=<tools-private-ip>:5000 --set image.tag=<version>
  registry: ""
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Created outside the chart (deploy/k8s/scripts/apply-secrets.sh); never versioned.
secretName: circleguard-secrets

# Prometheus scraping (HU-39). The ServiceMonitor is created only when the cluster has the
# Prometheus Operator CRDs (kube-prometheus-stack in the monitoring namespace), so the chart
# still installs on a cluster without monitoring.
metrics:
  serviceMonitor:
    enabled: true
    path: /actuator/prometheus
    interval: 30s

# Service mesh (Linkerd, deploy/k8s/scripts/install-mesh.sh). Only the application
# workloads (services below) get the proxy: calls between them use mTLS with one identity per
# ServiceAccount. The middleware stays outside the mesh, so meshed pods reach it without the
# proxy on these ports. Without Linkerd in the cluster the annotation does nothing.
mesh:
  enabled: false
  skipOutboundPorts: "389,4318,5432,6379,7687,9092"

# Progressive delivery of one service with Flagger (install-mesh.sh --canary).
# Needs mesh.enabled; the Canary is created only when the cluster has the Flagger and Gateway
# API CRDs. Flagger then owns the Services <service>, <service>-primary and <service>-canary,
# so the chart stops rendering the Service of that workload.
canary:
  enabled: false
  service: gateway
  prometheusUrl: http://kube-prometheus-stack-prometheus.monitoring:9090/prometheus
  loadtesterUrl: http://flagger-loadtester.flagger-system/
  # 20 % more traffic per minute up to 60 %, then promotion; 3 failed checks roll back.
  analysis:
    interval: 1m
    threshold: 3
    stepWeight: 20
    maxWeight: 60
  # Percentage of non-5xx responses and p99 latency, read from the Linkerd proxies.
  minSuccessRate: 99
  maxLatencyMs: 1000
  # Requests the load tester sends during the analysis (hey), on a path without a token.
  loadPath: /actuator/health

ingress:
  enabled: true
  className: traefik
  # Empty host answers on any name (the node's public IP); set it to a DNS name per environment.
  host: ""
  tls:
    enabled: true
    # Lab CA. Switch to "letsencrypt" only when host is a name Let's Encrypt can reach.
    # sslip.io is a shared domain and often exceeds the public rate limit.
    issuer: circleguard-ca
    secretName: circleguard-tls
    # Optional extra name, usually <public-ip>.sslip.io. deployK8s sets it from the node address.
    dnsName: ""

# Browser origins allowed by the services that check CORS.
corsAllowedOrigins: "http://localhost:8080"

# Defaults applied to every Spring Boot service (spring: true).
spring:
  config:
    MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED: "true"
    MANAGEMENT_HEALTH_READINESSSTATE_ENABLED: "true"
  # The root filesystem is read-only; Tomcat and the JVM write only here.
  writablePaths: [/tmp]
