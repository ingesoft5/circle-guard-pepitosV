# Flagger (install-mesh.sh --canary). It shifts traffic by editing a Gateway API HTTPRoute whose
# parent is the Service; Linkerd applies those weights to every meshed client.
meshProvider: gatewayapi:v1
# kube-prometheus-stack, served under /prometheus.
metricsServer: http://kube-prometheus-stack-prometheus.monitoring:9090/prometheus
# No -primary copies of gateway-config and circleguard-secrets; the checksum annotation still
# starts an analysis on a config change.
configTracking: {enabled: false}
# Flagger only calls the API server and Prometheus. Helm merges maps, so the chart's default
# inject annotation has to be overridden, not emptied.
podAnnotations: {linkerd.io/inject: disabled}
resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
# flagger_canary_status for the CanaryFailed alert; honorLabels keeps the canary's namespace.
podMonitor: {enabled: false, interval: 30s, honorLabels: true}
