# Values of the Flagger chart (install-mesh.sh --canary). Flagger shifts the traffic of a Canary by
# editing a Gateway API HTTPRoute whose parent is the Service; Linkerd applies those weights to
# every meshed client.
meshProvider: gatewayapi:v1
# The cluster's kube-prometheus-stack, which also scrapes the Linkerd proxies. Prometheus is
# served under /prometheus (routePrefix in observability/prometheus/values.yaml).
metricsServer: http://kube-prometheus-stack-prometheus.monitoring:9090/prometheus
# Without config tracking Flagger does not copy gateway-config and circleguard-secrets into
# -primary objects; a config change still starts an analysis through the checksum annotation.
configTracking:
  enabled: false
# The chart default injects Linkerd into Flagger. It only calls the API server and Prometheus,
# so a proxy there would be memory spent for nothing. Helm merges maps, so an empty map would
# keep the default annotation; it has to be overridden with "disabled".
podAnnotations:
  linkerd.io/inject: disabled
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
# flagger_canary_status for the CanaryFailed alert (observability/alerts). honorLabels keeps the
# namespace of the canary instead of flagger-system. install-mesh.sh turns it on.
podMonitor:
  enabled: false
  interval: 30s
  honorLabels: true
