# Linkerd identity issued by cert-manager (install-mesh.sh):
#   circleguard-selfsigned -> linkerd-trust-anchor (10 years, rotated by hand)
#     -> linkerd-identity-issuer (48 h, renewed by cert-manager) -> proxy certificates (24 h)
# Linkerd picks up each issuer renewal without a restart. It requires ECDSA P-256 keys.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: linkerd-trust-anchor
  namespace: linkerd
spec:
  isCA: true
  commonName: root.linkerd.cluster.local
  secretName: linkerd-trust-anchor
  # Renewing it without distributing the new one first breaks every mTLS connection.
  duration: 87600h
  renewBefore: 720h
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Never}
  issuerRef: {name: circleguard-selfsigned, kind: ClusterIssuer}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: linkerd-trust-anchor
  namespace: linkerd
spec:
  ca: {secretName: linkerd-trust-anchor}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: linkerd-identity-issuer
  namespace: linkerd
spec:
  isCA: true
  commonName: identity.linkerd.cluster.local
  dnsNames: [identity.linkerd.cluster.local]
  secretName: linkerd-identity-issuer
  duration: 48h
  renewBefore: 25h
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  usages: [cert sign, crl sign, server auth, client auth]
  issuerRef: {name: linkerd-trust-anchor, kind: Issuer}
