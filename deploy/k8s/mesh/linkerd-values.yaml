# linkerd-control-plane for the single-node k3s clusters (install-mesh.sh). No secrets: the trust
# anchor comes from cert-manager at install time.
controllerReplicas: 1
disableHeartBeat: true
# The issuer certificate lives in the Secret linkerd-identity-issuer, renewed by cert-manager.
identity: {issuer: {scheme: kubernetes.io/tls}}
# Ubuntu 24.04 and k3s use nf_tables.
proxyInit: {iptablesMode: nft}
# Default for every injected proxy. An idle proxy uses about 10 MiB; the limit stops a runaway one.
proxy:
  resources: {cpu: {request: 10m}, memory: {request: 20Mi, limit: 96Mi}}
destinationResources: {cpu: {request: 10m}, memory: {request: 48Mi, limit: 256Mi}}
identityResources: {cpu: {request: 10m}, memory: {request: 16Mi, limit: 64Mi}}
proxyInjectorResources: {cpu: {request: 10m}, memory: {request: 24Mi, limit: 128Mi}}
spValidatorResources: {cpu: {request: 10m}, memory: {request: 16Mi, limit: 64Mi}}
policyController:
  resources: {cpu: {request: 10m}, memory: {request: 32Mi, limit: 128Mi}}
# PodMonitors for kube-prometheus-stack, turned on by install-mesh.sh when the CRD exists. The
# proxy one adds the deployment label the canary queries use; linkerd-viz needs a short interval.
podMonitor:
  enabled: false
  scrapeInterval: 15s
  scrapeTimeout: 10s
  controller: {enabled: true}
  serviceMirror: {enabled: false}
  proxy: {enabled: true}
