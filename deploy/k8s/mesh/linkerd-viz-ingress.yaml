# Publishes the Linkerd dashboard at https://linkerd.<node-ip>.sslip.io behind the same BasicAuth
# user as Prometheus and Alertmanager. install-mesh.sh --viz replaces __HOST__ and creates the
# Secret viz-basic-auth from monitoring/monitoring-basic-auth (never versioned).
# Linkerd's dashboard only works from the root path, so it gets its own host instead of a path.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
  namespace: linkerd-viz
spec:
  basicAuth:
    secret: viz-basic-auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: linkerd-viz-tls
  namespace: linkerd-viz
spec:
  secretName: linkerd-viz-tls
  issuerRef:
    name: circleguard-ca
    kind: ClusterIssuer
  commonName: __HOST__
  dnsNames:
    - __HOST__
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkerd-viz
  namespace: linkerd-viz
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: linkerd-viz-basic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - secretName: linkerd-viz-tls
      hosts:
        - __HOST__
  rules:
    - host: __HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8084
