# Flagger load tester: runs the canary webhooks. Meshed, so its load follows the HTTPRoute weights.
# The Canary calls http://flagger-loadtester.flagger-system/.
fullnameOverride: flagger-loadtester
podAnnotations: {linkerd.io/inject: enabled}
securityContext: {enabled: true}
resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
