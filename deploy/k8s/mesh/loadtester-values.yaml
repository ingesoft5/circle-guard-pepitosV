# Values of the Flagger load tester (install-mesh.sh --canary). It runs the canary webhooks: the
# acceptance check before any traffic moves and the load during the analysis. It is meshed so
# its requests to gateway follow the HTTPRoute weights like the web client's.
# The Canary in the chart calls http://flagger-loadtester.flagger-system/ (port 80).
fullnameOverride: flagger-loadtester
podAnnotations:
  linkerd.io/inject: enabled
securityContext:
  enabled: true
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
