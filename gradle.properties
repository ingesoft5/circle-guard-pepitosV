# Reuse task outputs (compilation, tests) that did not change since an earlier build, and run
# independent projects in parallel. The local cache lives in the Jenkins home, so it survives
# between builds.
org.gradle.caching=true
org.gradle.parallel=true
# Gradle daemon (on by default): an idle daemon stops after 30 minutes instead of 3 hours, so the
# CI workers do not keep JVMs that no build uses.
org.gradle.daemon.idletimeout=1800000
