name: ${CI_PROJECT:-circleguard-ci}

services:
  jenkins:
    # jenkins/jenkins:lts-jdk21 + Docker CLI y Buildx (ver jenkins/Dockerfile)
    build:
      context: ./jenkins
    image: ${CI_PROJECT:-circleguard-ci}/jenkins:lts-jdk21-docker
    container_name: ${CI_PROJECT:-circleguard-ci}-jenkins
    restart: unless-stopped
    ports:
      - "${JENKINS_PORT:-8080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc.yaml
      JENKINS_URL: "http://${CI_DOMAIN:-localhost}:${JENKINS_PORT:-8080}"
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_USER:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      GITHUB_OWNER: ${GITHUB_OWNER:-ingesoft5}
      GITHUB_REPO: ${GITHUB_REPO:-circle-guard-pepitosV}
      GITHUB_USER: ${GITHUB_USER}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      E2E_USERNAME: ${E2E_USERNAME:-}
      E2E_PASSWORD: ${E2E_PASSWORD:-}
      NEXUS_REGISTRY: ${NEXUS_REGISTRY:-localhost:5000}
      IMAGE_NAMESPACE: ${IMAGE_NAMESPACE:-circleguard}
      DEPLOY_HOST_DEV: ${DEPLOY_HOST_DEV:-}
      DEPLOY_HOST_STAGE: ${DEPLOY_HOST_STAGE:-}
      DEPLOY_HOST_PROD: ${DEPLOY_HOST_PROD:-}
      NEXUS_CI_USER: ${NEXUS_CI_USER:-ci-publisher}
      NEXUS_CI_PASSWORD: ${NEXUS_CI_PASSWORD}
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jenkins/casc.yaml:/var/jenkins_home/casc.yaml:ro
      - ./jenkins/plugins.txt:/usr/share/jenkins/ref/plugins.txt:ro
      - ./secrets:/run/secrets/deploy:ro
    networks:
      - ci
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  sonar-db:
    image: postgres:16
    container_name: ${CI_PROJECT:-circleguard-ci}-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
      POSTGRES_DB: ${SONAR_DB_NAME:-sonarqube}
    volumes:
      - sonar_db:/var/lib/postgresql/data
    networks:
      - ci
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER:-sonar} -d ${SONAR_DB_NAME:-sonarqube}"]
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:lts-community
    container_name: ${CI_PROJECT:-circleguard-ci}-sonarqube
    restart: unless-stopped
    depends_on:
      - sonar-db
    ports:
      - "${SONAR_PORT:-9000}:9000"
    environment:
      SONAR_JDBC_URL: "jdbc:postgresql://sonar-db:5432/${SONAR_DB_NAME:-sonarqube}"
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    networks:
      - ci
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s

  nexus:
    image: sonatype/nexus3:3.75.1
    container_name: ${CI_PROJECT:-circleguard-ci}-nexus
    restart: unless-stopped
    ports:
      - "${NEXUS_PORT:-8081}:8081"
      - "${NEXUS_REGISTRY_PORT:-5000}:5000"
    volumes:
      - nexus_data:/nexus-data
    networks:
      - ci
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/service/rest/v1/status >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

networks:
  ci:
    name: ${CI_NETWORK:-circleguard-ci-net}

volumes:
  jenkins_home:
    name: ${CI_PROJECT:-circleguard-ci}-jenkins-home
  sonar_db:
    name: ${CI_PROJECT:-circleguard-ci}-sonar-db
  sonar_data:
    name: ${CI_PROJECT:-circleguard-ci}-sonar-data
  sonar_extensions:
    name: ${CI_PROJECT:-circleguard-ci}-sonar-extensions
  sonar_logs:
    name: ${CI_PROJECT:-circleguard-ci}-sonar-logs
  nexus_data:
    name: ${CI_PROJECT:-circleguard-ci}-nexus-data
