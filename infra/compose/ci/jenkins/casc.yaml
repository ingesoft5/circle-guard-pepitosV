jenkins:
  systemMessage: "CircleGuard CI — Jenkins"
  numExecutors: 1
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  globalNodeProperties:
    - envVars:
        env:
          # Registro y namespace que usa el paso dockerPublish (HU-07)
          - key: "NEXUS_REGISTRY"
            value: "${NEXUS_REGISTRY}"
          - key: "IMAGE_NAMESPACE"
            value: "${IMAGE_NAMESPACE}"
          # Private IP of each environment host, used by the deployCompose step
          - key: "DEPLOY_HOST_DEV"
            value: "${DEPLOY_HOST_DEV:-}"
          - key: "DEPLOY_HOST_STAGE"
            value: "${DEPLOY_HOST_STAGE:-}"
          - key: "DEPLOY_HOST_PROD"
            value: "${DEPLOY_HOST_PROD:-}"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-pat"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
              description: "GitHub token for multibranch scanning and commit statuses"
          - usernamePassword:
              scope: GLOBAL
              id: "nexus-ci"
              username: "${NEXUS_CI_USER}"
              password: "${NEXUS_CI_PASSWORD}"
              description: "Nexus user that pushes images to docker-hosted"
          - string:
              scope: GLOBAL
              id: "discord-webhook"
              secret: "${DISCORD_WEBHOOK_URL}"
              description: "Discord webhook for CircleGuard CI notifications"
          - usernamePassword:
              scope: GLOBAL
              id: "e2e-user"
              username: "${E2E_USERNAME:-}"
              password: "${E2E_PASSWORD:-}"
              description: "Web client user that the Playwright suite signs in with"
          # Declared here because JCasC removes any credential it does not list. The keys
          # are files on the CI host, written by infra/bootstrap/load-deploy-credential.sh.
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "deploy-ssh-dev"
              username: "deploy"
              description: "Deploy key for dev"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/deploy/deploy-ssh-dev}"
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "deploy-ssh-stage"
              username: "deploy"
              description: "Deploy key for stage"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/deploy/deploy-ssh-stage}"
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "deploy-ssh-prod"
              username: "deploy"
              description: "Deploy key for prod"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/deploy/deploy-ssh-prod}"

unclassified:
  location:
    url: "${JENKINS_URL}/"
  githubpluginconfig:
    configs:
      - name: "GitHub"
        apiUrl: "https://api.github.com"
        credentialsId: "github-pat"
        manageHooks: true
        clientCacheSize: 20
  globalLibraries:
    libraries:
      - name: "circleguard-shared-library"
        defaultVersion: "e3278dd67b98f1f4fd4c47ed8d6d1335ac8eb2a8"
        implicit: false
        allowVersionOverride: false
        retriever:
          modernSCM:
            libraryPath: "jenkins"
            scm:
              git:
                remote: "https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}.git"
                credentialsId: "github-pat"

jobs:
  - script: |
      multibranchPipelineJob('circleguard') {
        description('CircleGuard branches and pull requests')
        branchSources {
          github {
            id('circleguard-github')
            scanCredentialsId('github-pat')
            repoOwner("${GITHUB_OWNER}")
            repository("${GITHUB_REPO}")
            buildOriginBranch(true)
            // A branch with an open pull request is built only as PR-<n> (merged with its
            // base), so each push runs one build instead of two on the single executor.
            buildOriginBranchWithPR(false)
            buildOriginPRMerge(true)
            buildOriginPRHead(false)
            buildForkPRMerge(false)
            buildForkPRHead(false)
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(20)
          }
        }
      }
