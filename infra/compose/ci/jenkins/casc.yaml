jenkins:
  systemMessage: "CircleGuard CI — Jenkins"
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-pat"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
              description: "GitHub token for multibranch scanning and commit statuses"

unclassified:
  location:
    url: "${JENKINS_URL}/"
  githubpluginconfig:
    configs:
      - name: "GitHub"
        apiUrl: "https://api.github.com"
        credentialsId: "github-pat"
        manageHooks: true
        clientCacheSize: 20

jobs:
  - script: |
      multibranchPipelineJob('circleguard') {
        description('CircleGuard branches and pull requests')
        branchSources {
          github {
            id('circleguard-github')
            scanCredentialsId('github-pat')
            repoOwner("${GITHUB_OWNER}")
            repository("${GITHUB_REPO}")
            buildOriginBranch(true)
            buildOriginBranchWithPR(true)
            buildOriginPRMerge(true)
            buildOriginPRHead(false)
            buildForkPRMerge(false)
            buildForkPRHead(false)
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(20)
          }
        }
      }
