jenkins:
  systemMessage: "CircleGuard CI — Jenkins"
  numExecutors: 1
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        # Administrator and the only prod approver (input submitter, HU-21).
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
        # Non-admin account: runs, cancels and inspects builds, cannot approve prod.
        - id: "${JENKINS_DEV_ID}"
          password: "${JENKINS_DEV_PASSWORD}"
  # Jenkins lets any administrator answer an input, so only the admin account
  # gets Overall/Administer; every other account is a regular user.
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "${JENKINS_ADMIN_ID}"
            permissions:
              - "Overall/Administer"
        - group:
            name: "authenticated"
            permissions:
              - "Overall/Read"
              - "Job/Build"
              - "Job/Cancel"
              - "Job/Read"
              - "Job/Workspace"
              - "Run/Replay"
              - "View/Read"
  globalNodeProperties:
    - envVars:
        env:
          # Registro y namespace que usa el paso dockerPublish (HU-07)
          - key: "NEXUS_REGISTRY"
            value: "${NEXUS_REGISTRY}"
          - key: "IMAGE_NAMESPACE"
            value: "${IMAGE_NAMESPACE}"
          # Private IP of each environment host, used by the deployCompose step
          - key: "DEPLOY_HOST_DEV"
            value: "${DEPLOY_HOST_DEV:-}"
          - key: "DEPLOY_HOST_STAGE"
            value: "${DEPLOY_HOST_STAGE:-}"
          - key: "DEPLOY_HOST_PROD"
            value: "${DEPLOY_HOST_PROD:-}"
          # Branch the rollback job takes its pipeline and the shared library from (HU-17)
          - key: "ROLLBACK_BRANCH"
            value: "${ROLLBACK_BRANCH:-main}"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-pat"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
              description: "GitHub token for multibranch scanning and commit statuses"
          - usernamePassword:
              scope: GLOBAL
              id: "nexus-ci"
              username: "${NEXUS_CI_USER}"
              password: "${NEXUS_CI_PASSWORD}"
              description: "Nexus user that pushes images to docker-hosted"
          - string:
              scope: GLOBAL
              id: "discord-webhook"
              secret: "${DISCORD_WEBHOOK_URL}"
              description: "Discord webhook for CircleGuard CI notifications"
          - string:
              scope: GLOBAL
              id: "sonar-token"
              secret: "${SONAR_TOKEN}"
              description: "SonarQube analysis token"
          - usernamePassword:
              scope: GLOBAL
              id: "e2e-user"
              username: "${E2E_USERNAME:-}"
              password: "${E2E_PASSWORD:-}"
              description: "Web client user that the Playwright suite signs in with"
          # Declared here because JCasC removes any credential it does not list. The keys
          # are files on the CI host, written by infra/bootstrap/load-deploy-credential.sh.
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "deploy-ssh-dev"
              username: "deploy"
              description: "Deploy key for dev"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/deploy/deploy-ssh-dev}"
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "deploy-ssh-stage"
              username: "deploy"
              description: "Deploy key for stage"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/deploy/deploy-ssh-stage}"
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "deploy-ssh-prod"
              username: "deploy"
              description: "Deploy key for prod"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/deploy/deploy-ssh-prod}"

unclassified:
  location:
    url: "${JENKINS_URL}/"
  githubpluginconfig:
    configs:
      - name: "GitHub"
        apiUrl: "https://api.github.com"
        credentialsId: "github-pat"
        manageHooks: true
        clientCacheSize: 20

  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "SonarQube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"
  globalLibraries:
    libraries:
      - name: "circleguard-shared-library"
        # The Jenkinsfile loads the library from the branch being built. This version is only
        # a fallback for Jenkinsfiles that still use @Library without a version.
        defaultVersion: "5a8248a4df8ebe2b0213b9f06d221b737eaf0a50"
        implicit: false
        allowVersionOverride: true
        retriever:
          modernSCM:
            libraryPath: "jenkins"
            scm:
              git:
                remote: "https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}.git"
                credentialsId: "github-pat"

jobs:
  - script: |
      multibranchPipelineJob('circleguard') {
        description('CircleGuard branches and pull requests')
        branchSources {
          github {
            id('circleguard-github')
            scanCredentialsId('github-pat')
            repoOwner("${GITHUB_OWNER}")
            repository("${GITHUB_REPO}")
            buildOriginBranch(true)
            // A branch with an open pull request is built only as PR-<n> (merged with its
            // base), so each push runs one build instead of two on the single executor.
            buildOriginBranchWithPR(false)
            buildOriginPRMerge(true)
            buildOriginPRHead(false)
            buildForkPRMerge(false)
            buildForkPRHead(false)
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(20)
          }
        }
      }
  - script: |
      pipelineJob('circleguard-rollback') {
        description('Redeploys a version already published in Nexus to dev, stage or prod (HU-17)')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url("https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}.git")
                  credentials('github-pat')
                }
                branch("*/${ROLLBACK_BRANCH:-main}")
              }
            }
            scriptPath('jenkins/rollback.Jenkinsfile')
            lightweight(true)
          }
        }
      }
