jenkins:
  systemMessage: "CircleGuard CI — Jenkins"
  # Controller and workers: the controller (label 'controller') runs the light part of each
  # build (checkout, scans, plans, deploys, approvals), one executor per concurrent build; the
  # compile, test, Sonar and image lanes run on the workers (label 'worker').
  numExecutors: 4
  labelString: "controller"
  mode: NORMAL
  # Build workers: circleguard-ci-agent-<n> (infra/cloud/aws/provision-ci-hosts.sh), connected by
  # infra/bootstrap/bootstrap-ci-agent.sh over WebSocket. Two lanes each (2 vCPU per host).
  # EXCLUSIVE: only work asking for 'worker' lands there.
  nodes:
    - permanent:
        name: "ci-agent-1"
        labelString: "worker ci-agent-1"
        remoteFS: "/var/jenkins_home/agent"
        numExecutors: 2
        mode: EXCLUSIVE
        retentionStrategy: "always"
        launcher:
          inbound:
            webSocket: true
    - permanent:
        name: "ci-agent-2"
        labelString: "worker ci-agent-2"
        remoteFS: "/var/jenkins_home/agent"
        numExecutors: 2
        mode: EXCLUSIVE
        retentionStrategy: "always"
        launcher:
          inbound:
            webSocket: true
  securityRealm:
    local:
      allowsSignup: false
      users:
        # Administrator and the only prod approver (input submitter, HU-21).
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
        # Non-admin account: runs, cancels and inspects builds, cannot approve prod.
        - id: "${JENKINS_DEV_ID}"
          password: "${JENKINS_DEV_PASSWORD}"
  # Role-based Strategy. The prod input submitter stays "admin" in the Jenkinsfile.
  # Only the admin account has Overall/Administer, so a developer cannot approve it.
  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: "admin"
            description: "CircleGuard administrators"
            permissions:
              - "Overall/Administer"
            entries:
              - user: "${JENKINS_ADMIN_ID}"
          - name: "developer"
            description: "Builds and reads. Cannot approve production."
            permissions:
              - "Overall/Read"
              - "Job/Build"
              - "Job/Cancel"
              - "Job/Read"
              - "Job/Workspace"
              - "View/Read"
            entries:
              - user: "${JENKINS_DEV_ID}"
          - name: "approver"
            description: "Account allowed to approve the production input."
            permissions:
              - "Overall/Read"
              - "Job/Read"
              - "View/Read"
            entries:
              - user: "${JENKINS_ADMIN_ID}"
  globalNodeProperties:
    - envVars:
        env:
          # Registro y namespace que usa el paso dockerPublish (HU-07)
          - key: "NEXUS_REGISTRY"
            value: "${NEXUS_REGISTRY}"
          - key: "IMAGE_NAMESPACE"
            value: "${IMAGE_NAMESPACE}"
          # Registry HTTP API (promoteRelease, rollback): http://nexus:5000 or the tools host
          - key: "NEXUS_REGISTRY_API"
            value: "${NEXUS_REGISTRY_API:-http://nexus:5000}"
          # Gradle build cache node on the CI host (settings.gradle.kts), for every node
          - key: "GRADLE_BUILD_CACHE_URL"
            value: "${GRADLE_BUILD_CACHE_URL:-}"
          # Private IP of each environment host, used by the deployCompose step
          - key: "DEPLOY_HOST_DEV"
            value: "${DEPLOY_HOST_DEV:-}"
          - key: "DEPLOY_HOST_STAGE"
            value: "${DEPLOY_HOST_STAGE:-}"
          - key: "DEPLOY_HOST_PROD"
            value: "${DEPLOY_HOST_PROD:-}"
          # Private IP of each k3s node (Ingress), used by the deployK8s step and the E2E tests
          - key: "K8S_HOST_DEV"
            value: "${K8S_HOST_DEV:-}"
          - key: "K8S_HOST_STAGE"
            value: "${K8S_HOST_STAGE:-}"
          - key: "K8S_HOST_PROD"
            value: "${K8S_HOST_PROD:-}"
          # Region used by the Terraform plan/apply steps (HU-32)
          - key: "AWS_REGION"
            value: "${AWS_REGION:-us-east-1}"
          # Branch the rollback job takes its pipeline and the shared library from (HU-17)
          - key: "ROLLBACK_BRANCH"
            value: "${ROLLBACK_BRANCH:-main}"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-pat"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
              description: "GitHub token for multibranch scanning and commit statuses"
          - usernamePassword:
              scope: GLOBAL
              id: "nexus-ci"
              username: "${NEXUS_CI_USER}"
              password: "${NEXUS_CI_PASSWORD}"
              description: "Nexus user that pushes images to docker-hosted"
          - string:
              scope: GLOBAL
              id: "discord-webhook"
              secret: "${DISCORD_WEBHOOK_URL}"
              description: "Discord webhook for CircleGuard CI notifications"
          - string:
              scope: GLOBAL
              id: "sonar-token"
              secret: "${SONAR_TOKEN}"
              description: "SonarQube analysis token"
          - usernamePassword:
              scope: GLOBAL
              id: "e2e-user"
              username: "${E2E_USERNAME:-}"
              password: "${E2E_PASSWORD:-}"
              description: "Web client user that the Playwright suite signs in with"
          # Declared here because JCasC removes any credential it does not list. The keys
          # are files on the CI host, written by infra/bootstrap/load-deploy-credential.sh.
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "deploy-ssh-dev"
              username: "deploy"
              description: "Deploy key for dev"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/deploy/deploy-ssh-dev}"
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "deploy-ssh-stage"
              username: "deploy"
              description: "Deploy key for stage"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/deploy/deploy-ssh-stage}"
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "deploy-ssh-prod"
              username: "deploy"
              description: "Deploy key for prod"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/deploy/deploy-ssh-prod}"
          # kubeconfig of the dev k3s cluster (Part 2), loaded with load-kubeconfig.sh
          - file:
              scope: GLOBAL
              id: "kubeconfig-dev"
              fileName: "kubeconfig"
              description: "kubeconfig of the dev k3s cluster"
              secretBytes: "${readFileBase64:/run/secrets/deploy/kubeconfig-dev}"
          # kubeconfig of the stage k3s cluster (Part 2), loaded with load-kubeconfig.sh
          - file:
              scope: GLOBAL
              id: "kubeconfig-stage"
              fileName: "kubeconfig"
              description: "kubeconfig of the stage k3s cluster"
              secretBytes: "${readFileBase64:/run/secrets/deploy/kubeconfig-stage}"
          # kubeconfig of the prod k3s cluster (Part 2), loaded with load-kubeconfig.sh
          - file:
              scope: GLOBAL
              id: "kubeconfig-prod"
              fileName: "kubeconfig"
              description: "kubeconfig of the prod k3s cluster"
              secretBytes: "${readFileBase64:/run/secrets/deploy/kubeconfig-prod}"
          # Terraform plan/apply (HU-32). The files are written by
          # infra/bootstrap/load-terraform-credential.sh.
          - file:
              scope: GLOBAL
              id: "aws-terraform"
              fileName: "credentials"
              description: "AWS credentials for the Terraform pipeline steps"
              secretBytes: "${readFileBase64:/run/secrets/deploy/aws-terraform}"
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "prometheus-ssh-key"
              username: "ubuntu"
              description: "SSH key for the observability node (Terraform provisioner)"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/deploy/prometheus-ssh-key}"
          - string:
              scope: GLOBAL
              id: "prometheus-grafana-password"
              secret: "${readFile:/run/secrets/deploy/prometheus-grafana-password}"
              description: "Grafana admin password for the observability Helm release"

unclassified:
  location:
    url: "${JENKINS_URL}/"
  githubpluginconfig:
    configs:
      - name: "GitHub"
        apiUrl: "https://api.github.com"
        credentialsId: "github-pat"
        manageHooks: true
        clientCacheSize: 20

  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "SonarQube"
        serverUrl: "${SONAR_HOST_URL:-http://sonarqube:9000}"
        credentialsId: "sonar-token"
  globalLibraries:
    libraries:
      - name: "circleguard-shared-library"
        # The Jenkinsfile loads the library from the branch being built. This version is only
        # a fallback for Jenkinsfiles that still use @Library without a version.
        defaultVersion: "5a8248a4df8ebe2b0213b9f06d221b737eaf0a50"
        implicit: false
        allowVersionOverride: true
        retriever:
          modernSCM:
            libraryPath: "jenkins"
            scm:
              git:
                remote: "https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}.git"
                credentialsId: "github-pat"

jobs:
  - script: |
      multibranchPipelineJob('circleguard') {
        description('CircleGuard branches and pull requests')
        branchSources {
          github {
            id('circleguard-github')
            scanCredentialsId('github-pat')
            repoOwner("${GITHUB_OWNER}")
            repository("${GITHUB_REPO}")
            buildOriginBranch(true)
            // A branch with an open pull request is built only as PR-<n> (merged with its
            // base), so each push runs one build instead of two on the single executor.
            buildOriginBranchWithPR(false)
            buildOriginPRMerge(true)
            buildOriginPRHead(false)
            buildForkPRMerge(false)
            buildForkPRHead(false)
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(20)
          }
        }
      }
  - script: |
      pipelineJob('circleguard-rollback') {
        description('Redeploys a version already published in Nexus to dev, stage or prod (HU-17)')
        // Same parameters as jenkins/rollback.Jenkinsfile, so a recreated job offers
        // "Build with Parameters" before its first run.
        parameters {
          choiceParam('ENVIRONMENT', ['stage', 'dev', 'prod'], 'Environment to roll back')
          stringParam('VERSION', '', 'Version already published in Nexus, e.g. 0.1.0 or v0.1.0')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url("https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}.git")
                  credentials('github-pat')
                }
                branch("*/${ROLLBACK_BRANCH:-main}")
              }
            }
            scriptPath('jenkins/rollback.Jenkinsfile')
            lightweight(true)
          }
        }
      }
  - script: |
      pipelineJob('circleguard-release-notes') {
        description('Checks that every vX.Y.Z tag has its GitHub Release notes and completes the missing ones (HU-51)')
        // Same parameter as jenkins/release-notes.Jenkinsfile, so a recreated job offers
        // "Build with Parameters" before its first run.
        parameters {
          booleanParam('APPLY', false, 'Crea los releases que faltan y reemplaza las notas distintas. Sin marcar, solo informa.')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url("https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}.git")
                  credentials('github-pat')
                }
                branch('*/main')
              }
            }
            scriptPath('jenkins/release-notes.Jenkinsfile')
            lightweight(true)
          }
        }
      }
  - script: |
      pipelineJob('circleguard-prod-image-scan') {
        description('Scans the stable images that prod runs and notifies Discord on a high or critical finding')
        triggers {
          cron('H 6 * * *')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url("https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}.git")
                  credentials('github-pat')
                }
                branch('*/dev')
              }
            }
            scriptPath('jenkins/image-scan.Jenkinsfile')
            lightweight(false)
          }
        }
      }
