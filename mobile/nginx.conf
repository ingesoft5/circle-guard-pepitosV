# Es una PLANTILLA: la imagen nginx la copia a /etc/nginx/templates/ y al
# iniciar el contenedor reemplaza ${VARIABLE} con el valor del entorno
# (solo variables definidas; las de nginx como $uri no se tocan).
# Así la misma imagen sirve en dev, stage y prod: cada ambiente define a qué
# host:puerto apunta cada servicio (ver ENV *_UPSTREAM en el Dockerfile).
# =============================================================================

# DNS del contenedor (Docker o Kubernetes); lo detecta la imagen al arrancar.
# Resolver en tiempo de petición evita que nginx falle al iniciar si un
# servicio todavía no está desplegado en ese ambiente.
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 20m;   # adjuntos del cuestionario y planos (file/form)

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cabeceras hacia los microservicios
    proxy_http_version 1.1;
    # Keep the public host, so the services see same-origin requests from any environment address.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # Healthcheck del contenedor
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API: /svc/<servicio>/<ruta> -> http://<SERVICIO>_UPSTREAM/<ruta> ----
    location /svc/auth/ {
        set $upstream http://${AUTH_UPSTREAM};
        rewrite ^/svc/auth/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /svc/identity/ {
        set $upstream http://${IDENTITY_UPSTREAM};
        rewrite ^/svc/identity/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /svc/promotion/ {
        set $upstream http://${PROMOTION_UPSTREAM};
        rewrite ^/svc/promotion/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /svc/notification/ {
        set $upstream http://${NOTIFICATION_UPSTREAM};
        rewrite ^/svc/notification/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /svc/form/ {
        set $upstream http://${FORM_UPSTREAM};
        rewrite ^/svc/form/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /svc/file/ {
        set $upstream http://${FILE_UPSTREAM};
        rewrite ^/svc/file/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /svc/gateway/ {
        set $upstream http://${GATEWAY_UPSTREAM};
        rewrite ^/svc/gateway/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /svc/dashboard/ {
        set $upstream http://${DASHBOARD_UPSTREAM};
        rewrite ^/svc/dashboard/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    # ---- Estáticos ----
    # Bundles de Expo con hash en el nombre: se pueden cachear para siempre
    location /_expo/static/ {
        expires 1y;
        try_files $uri =404;
    }

    # Rutas de Expo Router: archivo exacto, página estática (ruta.html),
    # índice de carpeta y, si no existe (rutas dinámicas o recarga de una
    # ruta interna), index.html para que el router del cliente la resuelva.
    location / {
        expires -1;
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
