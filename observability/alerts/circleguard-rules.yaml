# CircleGuard alerts (HU-41). Prometheus loads every PrometheusRule (ruleSelector is empty in
# observability/prometheus/values.yaml) and Alertmanager sends the ones labelled
# project=circleguard to the team's Discord channel. Thresholds and how to trigger each alert on
# purpose are in docs/operaciones/observability.md.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: circleguard-alerts
  labels:
    app.kubernetes.io/part-of: circleguard
spec:
  groups:
    - name: circleguard.availability
      rules:
        - alert: ServiceDown
          # One series per scraped pod; the target disappears only when the pod is deleted.
          expr: up{namespace=~"circleguard-.+"} == 0
          for: 1m
          labels:
            severity: critical
            project: circleguard
          annotations:
            summary: "{{ $labels.service }} no responde en {{ $labels.namespace }}"
            description: >-
              Prometheus no puede leer /actuator/prometheus del pod {{ $labels.pod }} desde hace
              más de 1 minuto. Revisa el pod con kubectl -n {{ $labels.namespace }} describe pod
              {{ $labels.pod }}.

    - name: circleguard.http
      rules:
        - alert: HighErrorRate
          # More than 5 % of 5xx over 5 minutes, with at least 3 requests per minute so a single
          # failed request on an idle service does not page anyone.
          expr: |
            (
              sum by (namespace, environment, service) (
                rate(http_server_requests_seconds_count{namespace=~"circleguard-.+", uri!~"/actuator.*", outcome="SERVER_ERROR"}[5m])
              )
              /
              sum by (namespace, environment, service) (
                rate(http_server_requests_seconds_count{namespace=~"circleguard-.+", uri!~"/actuator.*"}[5m])
              )
            ) > 0.05
            and
            sum by (namespace, environment, service) (
              rate(http_server_requests_seconds_count{namespace=~"circleguard-.+", uri!~"/actuator.*"}[5m])
            ) > 0.05
          for: 2m
          labels:
            severity: critical
            project: circleguard
          annotations:
            summary: "{{ $labels.service }} responde con errores 5xx en {{ $labels.namespace }}"
            description: >-
              {{ $value | humanizePercentage }} de las respuestas de los últimos 5 minutos son 5xx
              (umbral 5 %). Revisa los logs del servicio en Grafana (Loki).

        - alert: HighLatencyP95
          # p95 above 1 s for 5 minutes. It uses the HTTP buckets from 25 ms to 5 s (HU-40).
          expr: |
            histogram_quantile(0.95,
              sum by (namespace, environment, service, le) (
                rate(http_server_requests_seconds_bucket{namespace=~"circleguard-.+", uri!~"/actuator.*"}[5m])
              )
            ) > 1
            and
            sum by (namespace, environment, service) (
              rate(http_server_requests_seconds_count{namespace=~"circleguard-.+", uri!~"/actuator.*"}[5m])
            ) > 0.05
          for: 5m
          labels:
            severity: warning
            project: circleguard
          annotations:
            summary: "{{ $labels.service }} está lento en {{ $labels.namespace }}"
            description: >-
              El percentil 95 de las respuestas HTTP es {{ $value | humanizeDuration }} desde hace
              5 minutos (umbral 1 s). Suele venir de una dependencia lenta: base de datos, Neo4j,
              Redis o Kafka.

    - name: circleguard.resilience
      rules:
        - alert: CircuitBreakerOpen
          # The gateway reads the health status from Redis through the redisHealth breaker
          # (docs/patrones/resiliencia.md). Open or half-open means Redis is failing and every
          # check-in is denied (fail closed). max_over_time keeps the alert steady while the
          # breaker cycles open -> half-open -> open under traffic.
          expr: |
            max by (namespace, environment, service, name) (
              max_over_time(resilience4j_circuitbreaker_state{namespace=~"circleguard-.+", state=~"open|half_open"}[1m])
            ) == 1
          for: 1m
          labels:
            severity: critical
            project: circleguard
          annotations:
            summary: "Circuito {{ $labels.name }} abierto en {{ $labels.service }} ({{ $labels.namespace }})"
            description: >-
              El circuit breaker {{ $labels.name }} está abierto desde hace más de 1 minuto: la
              dependencia falla y el gateway niega todas las entradas. Revisa Redis con
              kubectl -n {{ $labels.namespace }} get pods -l app.kubernetes.io/name=redis.

    - name: circleguard.delivery
      rules:
        - alert: CanaryFailed
          # Flagger (deploy/k8s/scripts/install-flagger.sh) reports 0 running, 1 promoted and
          # 2 failed per Canary. A failed analysis sent all the traffic back to the primary, so
          # the new version is deployed but serves nothing until the next deploy promotes one.
          expr: max by (namespace, name) (flagger_canary_status{namespace=~"circleguard-.+"}) == 2
          for: 1m
          labels:
            severity: warning
            project: circleguard
          annotations:
            summary: "El canary de {{ $labels.name }} falló en {{ $labels.namespace }}"
            description: >-
              Flagger devolvió todo el tráfico a {{ $labels.name }}-primary: la versión nueva no
              pasó el análisis de éxito o latencia. Revisa kubectl -n {{ $labels.namespace }}
              describe canary {{ $labels.name }}.
