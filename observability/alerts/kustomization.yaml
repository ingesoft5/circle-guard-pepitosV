# CircleGuard alert rules and Alertmanager routing (HU-41), applied to the monitoring namespace. deployK8s applies it
# after each deploy; by hand:
#   kubectl apply -k observability/alerts
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - circleguard-rules.yaml
  - alertmanager-config.yaml
