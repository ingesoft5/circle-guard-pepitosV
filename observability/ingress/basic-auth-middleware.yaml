# BasicAuth middleware for the Prometheus and Alertmanager Ingresses (HU-26).
# The Secret monitoring-basic-auth is created out of band by
# infra/bootstrap/load-monitoring-auth.sh. Never commit the htpasswd file or the password.
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
  namespace: monitoring
spec:
  basicAuth:
    secret: monitoring-basic-auth
