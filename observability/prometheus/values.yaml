# Base values for kube-prometheus-stack in the single-node k3s clusters.
# HU-26 installs the stack; HU-39 configures scraping and service metrics, HU-40 adds the
# dashboards and HU-41 the Alertmanager rules. Keep this file free of secrets.

grafana:
  enabled: true
  # Published through the cluster's Traefik on the already open port 80, at /grafana, so no
  # extra port is opened in the security group. Grafana keeps its own login; Prometheus and
  # Alertmanager have none and stay internal (kubectl port-forward). HU-47 adds TLS.
  ingress:
    enabled: true
    ingressClassName: traefik
    path: /grafana
    pathType: Prefix
    hosts: []
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana/"
      serve_from_sub_path: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
    datasources:
      enabled: true
      searchNamespace: ALL

prometheus:
  prometheusSpec:
    retention: 7d
    # Selectors empty so ServiceMonitors and rules from the application namespaces are discovered.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

# k3s runs the control plane in a single process, so these scrape targets do not exist.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
