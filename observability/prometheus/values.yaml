# Base values for kube-prometheus-stack in the single-node k3s clusters.
# HU-26 installs the stack; HU-39 configures scraping and service metrics, HU-40 adds the
# dashboards and HU-41 the Alertmanager rules. Keep this file free of secrets.

grafana:
  enabled: true
  # Published through the cluster's Traefik on the already open port 80, at /grafana, so no
  # extra port is opened in the security group. Grafana keeps its own login. Prometheus and
  # Alertmanager are published at /prometheus and /alertmanager behind the Traefik BasicAuth
  # middleware (monitoring-basic-auth). HU-47 adds TLS.
  ingress:
    enabled: true
    ingressClassName: traefik
    path: /grafana
    pathType: Prefix
    hosts: []
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana/"
      serve_from_sub_path: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
    datasources:
      enabled: true
      searchNamespace: ALL

prometheus:
  # Published through the cluster's Traefik at /prometheus on the already open port 80.
  # The BasicAuth middleware is created by infra/bootstrap/load-monitoring-auth.sh.
  ingress:
    enabled: true
    ingressClassName: traefik
    pathType: Prefix
    paths:
      - /prometheus
    hosts: []
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: monitoring-basic-auth@kubernetescrd
  prometheusSpec:
    # The external URL needs the /prometheus path: without it, the root redirect goes to
    # /graph, which is not a Prometheus route and falls into the web client's 404.
    externalUrl: /prometheus
    routePrefix: /prometheus
    retention: 7d
    # Selectors empty so ServiceMonitors and rules from the application namespaces are discovered.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

alertmanager:
  enabled: true
  # Published through the cluster's Traefik at /alertmanager on the already open port 80.
  # The BasicAuth middleware is created by infra/bootstrap/load-monitoring-auth.sh.
  ingress:
    enabled: true
    ingressClassName: traefik
    pathType: Prefix
    paths:
      - /alertmanager
    hosts: []
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: monitoring-basic-auth@kubernetescrd
  # Notifications (HU-41). Only the alerts labelled project=circleguard (observability/alerts/)
  # go to Discord; the stack's own cluster alerts stay visible in /alertmanager without paging.
  # The webhook URL is not in Git: infra/bootstrap/load-alertmanager-discord.sh creates the
  # alertmanager-discord Secret, mounted below. Until it exists, Alertmanager runs and the
  # Discord notifications fail.
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: [alertname, namespace, service]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: discord
          matchers:
            - project = "circleguard"
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/discord/webhook-url
            send_resolved: true
            title: >-
              [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
              {{ .CommonLabels.alertname }} · {{ .CommonLabels.namespace }}
            message: |-
              {{ range .Alerts }}**{{ .Labels.severity }}** · {{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ end }}
    inhibit_rules:
      # While a service has a critical alert, its warnings are not sent.
      - source_matchers: [severity = "critical"]
        target_matchers: [severity = "warning"]
        equal: [namespace, service]
    templates:
      - /etc/alertmanager/config/*.tmpl
  alertmanagerSpec:
    routePrefix: /alertmanager
    volumes:
      - name: discord-webhook
        secret:
          secretName: alertmanager-discord
          # Optional, so Alertmanager starts before the Secret is created.
          optional: true
    volumeMounts:
      - name: discord-webhook
        mountPath: /etc/alertmanager/discord
        readOnly: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

# k3s runs the control plane in a single process, so these scrape targets do not exist.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
