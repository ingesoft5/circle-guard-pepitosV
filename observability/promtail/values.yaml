# Ships every pod log to the in-cluster Loki. JSON lines also get level and service labels.
# traceId stays in the line so Grafana's derived field can open it in Jaeger.
config:
  clients:
    - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
  snippets:
    pipelineStages:
      - cri: {}
      - json:
          expressions:
            level: level
            service: service
      - labels:
          level:
          service:

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 128Mi
