spring:
  application:
    name: circleguard-auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/circleguard_auth
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ldap:
    urls: ldap://localhost:389
    base: dc=circleguard,dc=edu
    username: cn=admin,dc=circleguard,dc=edu
    password: admin

jwt:
  secret: "my-super-secret-dev-key-32-chars-long-12345678"
  expiration: 3600000

qr:
  secret: "my-qr-secret-key-for-dev-1234567890"
  # Milliseconds. Env QR_EXPIRATION or a profile overrides this without a new image.
  expiration: 60000

server:
  port: 8180

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      # Same value in every metric, so dashboards can filter by service.
      application: ${spring.application.name}
    distribution:
      slo:
        # Few buckets on purpose: enough for the p95 panel in Grafana, cheap in series.
        "[http.server.requests]": 25ms,50ms,100ms,250ms,500ms,1s,2s,5s

identity:
  url: http://localhost:8083

circleguard:
  cors:
    # Comma separated browser origins allowed to call this service from another domain.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:8080}
