jwt:
  secret: "my-super-secret-test-key-32-chars-long"
  expiration: 3600000

spring:
  ldap:
    urls: ldap://localhost:389
    base: dc=circleguard,dc=edu
    username: cn=admin,dc=circleguard,dc=edu
    password: test
  main:
    allow-bean-definition-overriding: true
