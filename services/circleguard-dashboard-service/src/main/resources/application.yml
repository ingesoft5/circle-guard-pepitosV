spring:
  application:
    name: circleguard-dashboard-service
  datasource:
    url: jdbc:postgresql://localhost:5432/circleguard_dashboard
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      # Same value in every metric, so dashboards can filter by service.
      application: ${spring.application.name}
    distribution:
      slo:
        # Few buckets on purpose: enough for the p95 panel in Grafana, cheap in series.
        "[http.server.requests]": 25ms,50ms,100ms,250ms,500ms,1s,2s,5s
