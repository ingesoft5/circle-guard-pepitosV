spring:
  application:
    name: circleguard-file-service
  servlet:
    multipart:
      # Same limit as client_max_body_size of the web client's nginx (the default is 1 MB).
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8085

circleguard:
  storage:
    # Empty bucket: files go to local-dir (development, Docker Compose). The chart sets the
    # bucket of each environment through CIRCLEGUARD_STORAGE_S3_BUCKET.
    local-dir: uploads
    s3:
      bucket: ""
      region: ${AWS_REGION:us-east-1}
      prefix: uploads/

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      # Same value in every metric, so dashboards can filter by service.
      application: ${spring.application.name}
    distribution:
      slo:
        # Few buckets on purpose: enough for the p95 panel in Grafana, cheap in series.
        "[http.server.requests]": 25ms,50ms,100ms,250ms,500ms,1s,2s,5s
